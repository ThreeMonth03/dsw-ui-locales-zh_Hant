name: Check translation contributions
on:
  pull_request:
    branches:
      - sync/v*
permissions:
  contents: read
jobs:
  check:
    uses: ThreeMonth03/dsw-locale-tool/.github/workflows/check-translations.yml@a973931e0a0111dbc0b5993a83e1ed86964ca90f
    with:
      tool_ref: a973931e0a0111dbc0b5993a83e1ed86964ca90f
      base_sha: ${{ github.event.pull_request.base.sha }}
      head_sha: ${{ github.sha }}
      head_repository: ${{ github.repository }}
      branch: ${{ github.event.pull_request.base.ref }}
