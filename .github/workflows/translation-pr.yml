name: Check translation contributions
on:
  pull_request:
    branches:
      - sync/v*
permissions:
  contents: read
jobs:
  check:
    uses: ThreeMonth03/dsw-locale-tool/.github/workflows/check-translations.yml@7a4c5b21f19b8a763d59bb4d9be60eed8a5d0bb9
    with:
      tool_ref: 7a4c5b21f19b8a763d59bb4d9be60eed8a5d0bb9
      base_sha: ${{ github.event.pull_request.base.sha }}
      head_sha: ${{ github.sha }}
      head_repository: ${{ github.repository }}
      branch: ${{ github.event.pull_request.base.ref }}
