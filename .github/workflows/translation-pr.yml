name: Check translation contributions
on:
  pull_request:
    branches:
      - sync/v*
permissions:
  contents: read
jobs:
  check:
    uses: ThreeMonth03/dsw-locale-tool/.github/workflows/check-translations.yml@53940c2f22ee3b84266b00fc1a5f56c82da61ca8
    with:
      tool_ref: 53940c2f22ee3b84266b00fc1a5f56c82da61ca8
      base_sha: ${{ github.event.pull_request.base.sha }}
      head_sha: ${{ github.event.pull_request.head.sha }}
      head_repository: ${{ github.event.pull_request.head.repo.full_name }}
      branch: ${{ github.event.pull_request.base.ref }}
