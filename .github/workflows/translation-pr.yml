name: Check translation contributions
on:
  pull_request:
    branches:
      - sync/v*
permissions:
  contents: read
jobs:
  check:
    uses: ThreeMonth03/dsw-locale-tool/.github/workflows/check-translations.yml@e44fc99b0fc3161ff3311cf4e44df1d6676c9754
    with:
      tool_ref: e44fc99b0fc3161ff3311cf4e44df1d6676c9754
      base_sha: ${{ github.event.pull_request.base.sha }}
      head_sha: ${{ github.sha }}
      head_repository: ${{ github.repository }}
      branch: ${{ github.event.pull_request.base.ref }}
