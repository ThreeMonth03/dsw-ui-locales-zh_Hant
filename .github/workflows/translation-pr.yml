name: Check translation contributions
on:
  pull_request:
    branches:
      - sync/v*
permissions:
  contents: read
jobs:
  check:
    uses: ThreeMonth03/dsw-locale-tool/.github/workflows/check-translations.yml@dd9c0b1aa1939f8144474d75f47b18a02ba3ccc0
    with:
      tool_ref: dd9c0b1aa1939f8144474d75f47b18a02ba3ccc0
      base_sha: ${{ github.event.pull_request.base.sha }}
      head_sha: ${{ github.sha }}
      head_repository: ${{ github.repository }}
      branch: ${{ github.event.pull_request.base.ref }}
