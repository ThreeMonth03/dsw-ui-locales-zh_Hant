name: Check translation contributions
on:
  pull_request:
    branches:
      - sync/v*
permissions:
  contents: read
jobs:
  check:
    uses: ThreeMonth03/dsw-locale-tool/.github/workflows/check-translations.yml@b8395e968713a784b9265e731e61737f012098a3
    with:
      tool_ref: b8395e968713a784b9265e731e61737f012098a3
      base_sha: ${{ github.event.pull_request.base.sha }}
      head_sha: ${{ github.sha }}
      head_repository: ${{ github.repository }}
      branch: ${{ github.event.pull_request.base.ref }}
