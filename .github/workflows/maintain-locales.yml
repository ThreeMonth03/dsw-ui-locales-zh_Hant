name: Synchronize official translations
on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"
concurrency:
  group: locale-maintenance
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  sync:
    if: github.ref == 'refs/heads/main'
    uses: ThreeMonth03/dsw-locale-tool/.github/workflows/sync-weblate.yml@e44fc99b0fc3161ff3311cf4e44df1d6676c9754
    with:
      tool_ref: e44fc99b0fc3161ff3311cf4e44df1d6676c9754
