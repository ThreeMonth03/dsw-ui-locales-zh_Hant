name: Synchronize official translations
on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"
concurrency:
  group: locale-maintenance
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  sync:
    if: github.ref == 'refs/heads/main'
    uses: ThreeMonth03/dsw-locale-tool/.github/workflows/sync-weblate.yml@7a4c5b21f19b8a763d59bb4d9be60eed8a5d0bb9
    with:
      tool_ref: 7a4c5b21f19b8a763d59bb4d9be60eed8a5d0bb9
