name: Synchronize official translations
on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"
concurrency:
  group: locale-maintenance
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  sync:
    if: github.ref == 'refs/heads/main'
    uses: ThreeMonth03/dsw-locale-tool/.github/workflows/sync-weblate.yml@a973931e0a0111dbc0b5993a83e1ed86964ca90f
    with:
      tool_ref: a973931e0a0111dbc0b5993a83e1ed86964ca90f
