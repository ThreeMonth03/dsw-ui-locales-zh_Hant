name: 回報英文漏翻
description: 回報 DSW UI 仍顯示英文、或官方 POT 尚未收錄的字串
title: "[漏翻] "
labels:
  - translation
  - missing-string
body:
  - type: dropdown
    id: version
    attributes:
      label: DSW 版本
      options:
        - "4.32"
        - "4.31"
        - 不確定
    validations:
      required: true
  - type: input
    id: location
    attributes:
      label: 畫面位置或網址
      placeholder: 例如：Projects → Questionnaire → Settings
    validations:
      required: true
  - type: textarea
    id: source
    attributes:
      label: 完整英文原文
      description: 請保留大小寫、標點、換行與 placeholder。
      render: text
    validations:
      required: true
  - type: textarea
    id: translation
    attributes:
      label: 建議繁體中文譯文
      description: 不確定時可以留空，供後續討論。
      render: text
  - type: textarea
    id: evidence
    attributes:
      label: 截圖與重現方式
      description: 可直接拖入截圖；若需特定權限、資料或操作，請一併說明。
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: 送出前確認
      options:
        - label: 我已確認這段英文來自 DSW UI，而不是 Knowledge Model 或 Document Template 內容。
          required: true

